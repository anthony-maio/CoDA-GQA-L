[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coda-gqa-l"
version = "1.0.0"
description = "Bounded-memory differential attention with value-routed landmark banks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Anthony Maio"},
]
keywords = [
    "attention",
    "transformer",
    "kv-cache",
    "differential-attention",
    "bounded-memory",
    "landmark",
    "pytorch",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
triton = [
    "triton>=2.1",
]

[project.urls]
Homepage = "https://github.com/anthony-maio/CoDA-GQA-L"
Repository = "https://github.com/anthony-maio/CoDA-GQA-L"
Issues = "https://github.com/anthony-maio/CoDA-GQA-L/issues"

[tool.setuptools]
packages = ["coda_gqa_l", "triton_bank_routing", "triton_diff_flash"]

[tool.setuptools.package-dir]
coda_gqa_l = "src/coda_gqa_l"
triton_bank_routing = "kernels/triton_bank_routing"
triton_diff_flash = "kernels/triton_diff_flash"
